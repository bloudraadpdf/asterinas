[package]
name = "asterinas"
version = "0.1.0"
edition.workspace = true

[dependencies]
aster-core.workspace = true
ostd.workspace = true

# High-level component crates.
#
# Keep this list in sync with the `extern crate` declarations in `src/lib.rs`.
aster-drm = { workspace = true, optional = true }
aster-simpledrm = { workspace = true, optional = true }
aster-uart.workspace = true

[target.x86_64-unknown-none.dependencies]
aster-i8042 = { workspace = true, optional = true }

[features]
log_max_level_info = ["aster-core/log_max_level_info"]
default = ["cvm_guest", "console_video", "storage_nvme", "filesystems_extra", "virtio_devices", "virtio_pci"]
console_video = ["aster-core/console_video", "dep:aster-drm", "dep:aster-simpledrm", "dep:aster-i8042"]
storage_nvme = ["aster-core/storage_nvme"]
configfs = ["aster-core/configfs"]
fs_erofs = ["aster-core/fs_erofs"]
fs_ext4 = ["aster-core/fs_ext4"]
filesystems_extra = ["aster-core/filesystems_extra"]
virtio_devices = ["aster-core/virtio_devices"]
virtio_block = ["aster-core/virtio_block"]
virtio_net = ["aster-core/virtio_net"]
virtio_pci = ["aster-core/virtio_pci"]
coverage = ["aster-core/coverage"]
cvm_guest = ["aster-core/cvm_guest"]
pvh_boot = ["aster-core/pvh_boot"]
pvh_boot_only = ["pvh_boot", "aster-core/pvh_boot_only"]
http_listen = ["aster-core/http_listen"]
vm_restore = ["aster-core/vm_restore"]
privileged_vsock = ["aster-core/privileged_vsock"]
riscv_sv39_mode = ["aster-core/riscv_sv39_mode"]

[lints]
workspace = true
