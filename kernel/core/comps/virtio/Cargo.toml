[package]
name = "aster-virtio"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aster-bigtcp.workspace = true
aster-block = { workspace = true, optional = true }
aster-console = { workspace = true, optional = true }
aster-fuse = { workspace = true, optional = true }
aster-input = { workspace = true, optional = true }
aster-network.workspace = true
aster-pci = { workspace = true, optional = true }
aster-rights.workspace = true
aster-softirq.workspace = true
aster-util.workspace = true
bitflags.workspace = true
component.workspace = true
device-id.workspace = true
dma-pool.workspace = true
id-alloc.workspace = true
int-to-c-enum.workspace = true
io-util.workspace = true
ostd.workspace = true
ostd-pod.workspace = true
short-vis-path.workspace = true
smallvec.workspace = true
spin.workspace = true
typeflags-util.workspace = true
zerocopy.workspace = true

[target.x86_64-unknown-none.dependencies]
aster-cmdline.workspace = true
tdx-guest = { workspace = true, optional = true }

[target.riscv64imac-unknown-none-elf.dependencies]
fdt-util.workspace = true

[target.aarch64-unknown-none-softfloat.dependencies]
fdt-util.workspace = true

[features]
default = ["devices", "pci"]
devices = ["dep:aster-block", "dep:aster-console", "dep:aster-fuse", "dep:aster-input"]
pci = ["dep:aster-pci"]
all = ["cvm_guest", "devices", "pci"]
cvm_guest = ["dep:tdx-guest", "ostd/cvm_guest"]

[lints]
workspace = true
